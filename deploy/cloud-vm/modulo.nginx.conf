# This hostname maps to the user-supplied server without a purchased domain.
map $http_origin $modulo_origin_allowed {
    default 0;
    "" 1;
    "https://modulo.69-169-102-112.sslip.io" 1;
}
map $request_method $modulo_action_key {
    default "";
    POST $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $modulo_action_key zone=modulo_actions:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name modulo.69-169-102-112.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/modulo-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modulo.69-169-102-112.sslip.io;
    ssl_certificate /etc/modulo-letsencrypt/live/modulo.69-169-102-112.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/modulo-letsencrypt/live/modulo.69-169-102-112.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "modulo judge access";
    auth_basic_user_file /etc/modulo/htpasswd;
    root /opt/modulo/current/apps/web/dist;
    index index.html;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        # Validate the browser origin before adapting to the API's localhost boundary.
        if ($modulo_origin_allowed = 0) { return 403; }
        limit_req zone=modulo_actions burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host localhost;
        proxy_set_header Origin http://localhost;
        proxy_set_header Authorization "";
        proxy_read_timeout 80s;
        proxy_send_timeout 80s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
