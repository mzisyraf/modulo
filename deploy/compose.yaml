services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    gpus: all
    init: true
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BUDGET_USD: ${NEBIUS_BUDGET_USD:-0}
      NEBIUS_MAX_REQUESTS: ${NEBIUS_MAX_REQUESTS:-0}
    volumes:
      - jobs:/app/data
      - models:/app/models/torch
    restart: "no"
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    environment:
      MODULO_DOMAIN: ${MODULO_DOMAIN:?Set the HTTPS domain}
      MODULO_PASSWORD_HASH: ${MODULO_PASSWORD_HASH:?Set a Caddy password hash}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: "no"
volumes:
  jobs:
  models:
  certificates:
  caddy_config:
